main:
  params: [args]
  steps:

    # ── INIT ───────────────────────────────────────────────────────────────────
    - init:
        assign:
          - run_id: ${sys.now()}
          - cf_dim:       "https://cf-dim-xw5u2boozq-de.a.run.app"
          - cf_fx:        "https://cf-fx-xw5u2boozq-de.a.run.app"
          - cf_facts:     "https://cf-facts-xw5u2boozq-de.a.run.app"
          - cf_dq:        "https://cf-dq-xw5u2boozq-de.a.run.app"

    # ── STEP 1: обновление справочников ───────────────────────────────────────
    - step_dim:
        try:
          call: http.post
          args:
            url: ${cf_dim}
            auth:
              type: OIDC
            body:
              run_id: ${run_id}
            timeout: 540
          result: dim_result
        except:
          as: e
          steps:
            - log_dim_error:
                call: sys.log
                args:
                  text: ${"[WEEKLY] step_dim FAILED run_id=" + run_id + " error=" + json.encode_to_string(e)}
                  severity: ERROR
            - raise_dim:
                raise: ${e}

    # ── STEP 2: курсы НБКР ────────────────────────────────────────────────────
    - step_fx:
        try:
          call: http.post
          args:
            url: ${cf_fx}
            auth:
              type: OIDC
            body:
              run_id: ${run_id}
            timeout: 180
          result: fx_result
        except:
          as: e
          steps:
            - log_fx_error:
                call: sys.log
                args:
                  text: ${"[WEEKLY] step_fx FAILED run_id=" + run_id + " error=" + json.encode_to_string(e)}
                  severity: ERROR
            - raise_fx:
                raise: ${e}

    # ── STEP 3: загрузка отгрузок + byvariant (90d rolling) ───────────────────
    - step_facts:
        try:
          call: http.post
          args:
            url: ${cf_facts}
            auth:
              type: OIDC
            body:
              run_id: ${run_id}
              mode: "weekly"
            timeout: 600
          result: facts_result
        except:
          as: e
          steps:
            - log_facts_error:
                call: sys.log
                args:
                  text: ${"[WEEKLY] step_facts FAILED run_id=" + run_id + " error=" + json.encode_to_string(e)}
                  severity: ERROR
            - raise_facts:
                raise: ${e}

    # ── STEP 4: DQ Gate ───────────────────────────────────────────────────────
    - step_dq:
        try:
          call: http.post
          args:
            url: ${cf_dq}
            auth:
              type: OIDC
            body:
              run_id: ${run_id}
            timeout: 120
          result: dq_result
        except:
          as: e
          steps:
            - log_dq_error:
                call: sys.log
                args:
                  text: ${"[WEEKLY] step_dq CRASHED run_id=" + run_id + " error=" + json.encode_to_string(e)}
                  severity: CRITICAL
            - raise_dq:
                raise: ${e}

    # ── STEP 5: decode DQ response (Л-02: Workflows не авто-парсит JSON body) ─
    - parse_dq_result:
        assign:
          - dq_parsed: ${json.decode(dq_result.body)}

    # ── STEP 6: проверка результата DQ ────────────────────────────────────────
    - check_dq:
        switch:
          - condition: ${not(dq_parsed.passed)}
            steps:
              - log_dq_failed:
                  call: sys.log
                  args:
                    text: ${"[WEEKLY] DQ Gate FAILED run_id=" + run_id + " details=" + json.encode_to_string(dq_parsed)}
                    severity: CRITICAL
              - raise_dq_failed:
                  raise: "DQ Gate failed — promote blocked"

    # ── STEP 7: promote staging → core (90d window) ───────────────────────────
    - step_promote:
        try:
          call: http.post
          args:
            url: ${cf_facts}
            auth:
              type: OIDC
            body:
              run_id: ${run_id}
              mode: "promote"
              window_days: 90
            timeout: 540
          result: promote_result
        except:
          as: e
          steps:
            - log_promote_error:
                call: sys.log
                args:
                  text: ${"[WEEKLY] step_promote FAILED run_id=" + run_id + " error=" + json.encode_to_string(e)}
                  severity: ERROR
            - raise_promote:
                raise: ${e}

    # ── STEP 8: закупки — полный refresh ──────────────────────────────────────
    # WRITE_TRUNCATE: ~173 заказа × ~30 позиций. Статусы (В пути / Прибыл)
    # захватываются на каждом прогоне. Не блокирует promote при ошибке.
    - step_purchases:
        try:
          call: http.post
          args:
            url: ${cf_facts}
            auth:
              type: OIDC
            body:
              run_id: ${run_id}
              mode: "purchases"
            timeout: 300
          result: purchases_result
        except:
          as: e
          steps:
            - log_purchases_error:
                call: sys.log
                args:
                  text: ${"[WEEKLY] step_purchases FAILED run_id=" + run_id + " error=" + json.encode_to_string(e)}
                  severity: ERROR
            - raise_purchases:
                raise: ${e}

    # ── STEP 9: возвраты покупателей (90d rolling) ────────────────────────────
    # После promote — независимая таблица, вне DQ-цепочки продаж.
    # 0 записей за окно — не ошибка (early return guard в CF-Facts).
    - step_returns:
        try:
          call: http.post
          args:
            url: ${cf_facts}
            auth:
              type: OIDC
            body:
              run_id: ${run_id}
              mode: "returns"
              window_days: 90
            timeout: 300
          result: returns_result
        except:
          as: e
          steps:
            - log_returns_error:
                call: sys.log
                args:
                  text: ${"[WEEKLY] step_returns FAILED run_id=" + run_id + " error=" + json.encode_to_string(e)}
                  severity: ERROR
            - raise_returns:
                raise: ${e}

    # ── DONE ──────────────────────────────────────────────────────────────────
    - done:
        steps:
          - log_success:
              call: sys.log
              args:
                text: ${"[WEEKLY] Pipeline COMPLETED run_id=" + run_id}
                severity: INFO
          - return_result:
              return: ${promote_result.body}